<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disney Dreamlight Valley — The Keepsake Sea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #fdf1f5;
      --bg-mid: #f5ecfb;
      --bg-bottom: #eef4fc;
      --surface: #ffffff;
      --surface-tint: #fff8fa;
      --meringue-pink: #f7cad7;
      --candy-rose: #d46a8e;
      --berry-deep: #8f3b5b;
      --pastel-sky: #cfe0f7;
      --pastel-lilac: #e3d6f7;
      --ink-main: #351d2b;
      --ink-soft: #785568;
      --border-pastel: #f0cedb;
      --shadow-card: 0 6px 18px rgba(143, 59, 91, 0.09);
      --energy-color: #4f78b5;
      --gold-color: #b57c35;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(165deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bottom) 100%);
      color: var(--ink-main);
      min-height: 100vh;
      line-height: 1.4;
    }

    /* === ACCUEIL : ILLUSTRATION PLEIN ÉCRAN + DOCK DE BOUTONS === */
    body { font-family: "Fredoka", "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    .home-hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(160deg, #f8d7e3 0%, #eadbf8 52%, #dcebfa 100%);
    }
    .home-hero.hidden { display: none; }

    /* Fond flouté (uniquement pour combler les côtés si l'écran n'a pas le format du dessin) */
    .hero-blur {
      position: absolute; inset: -40px;
      width: calc(100% + 80px); height: calc(100% + 80px);
      object-fit: cover;
      filter: blur(28px) saturate(1.15);
      transform: scale(1.05);
      opacity: 0;
      transition: opacity .5s ease;
    }
    /* Le dessin, net, jamais déformé */
    .hero-art {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center;
      opacity: 0;
      transition: opacity .5s ease;
    }
    .home-hero.loaded .hero-blur,
    .home-hero.loaded .hero-art { opacity: 1; }

    /* Écrans proches du format du dessin (téléphone en pause, tablette, fenêtre étroite) :
       le dessin remplit toute la page */
    @media (min-aspect-ratio: 3/5) and (max-aspect-ratio: 1/1) {
      .hero-art { object-fit: cover; object-position: center 32%; }
      .hero-blur { display: none; }
    }

    /* Téléphone en hauteur : le dessin reste entier, remonté pour laisser les boutons en dessous */
    @media (max-aspect-ratio: 3/5) {
      .hero-art { object-position: center 36%; }
    }

    /* Voile très léger en bas pour que les boutons restent lisibles sans toucher au dessin */
    .hero-fade {
      position: absolute; left: 0; right: 0; bottom: 0; height: 26%;
      background: linear-gradient(to top, rgba(143,59,91,.30), rgba(143,59,91,0));
      pointer-events: none;
    }

    .dock {
      position: absolute;
      left: 50%; bottom: max(22px, 3.5vh);
      transform: translateX(-50%);
      width: min(calc(100% - 28px), 640px);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      z-index: 3;
    }

    .tile {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px;
      padding: 10px 4px 9px;
      min-height: 84px;
      background: rgba(255, 255, 255, 0.82);
      -webkit-backdrop-filter: blur(10px) saturate(1.3);
      backdrop-filter: blur(10px) saturate(1.3);
      border: 2px solid rgba(255, 255, 255, 0.95);
      border-radius: 22px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--berry-deep);
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(143, 59, 91, 0.22), inset 0 -3px 0 rgba(247, 202, 215, 0.75);
      transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, background .18s ease;
    }
    .tile:hover, .tile:focus-visible {
      transform: translateY(-5px) scale(1.04);
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 14px 26px rgba(143, 59, 91, 0.28), inset 0 -3px 0 var(--meringue-pink);
      outline: none;
    }
    .tile:active { transform: translateY(0) scale(.98); }

    .tile-bubble {
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, #fde3ec, #e6dbfa);
      border: 1.5px solid var(--meringue-pink);
    }
    .tile-bubble img { width: 22px; height: 22px; object-fit: contain; }
    .tile-bubble .tiny-emoji { font-size: 1.15rem; line-height: 1; }
    .tile span.label { line-height: 1; letter-spacing: .01em; }

    /* Mobile : 3 x 2 */
    @media (max-width: 560px) {
      .dock { grid-template-columns: repeat(3, 1fr); gap: 9px; }
      .tile { min-height: 78px; font-size: 0.8rem; }
    }

    /* === VUE DE CATÉGORIE === */
    .app-view {
      display: none;
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 16px 48px;
    }

    .app-view.active {
      display: block;
    }

    .top-bar {
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid var(--border-pastel);
      border-radius: 20px;
      padding: 12px 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .back-home-btn {
      background: linear-gradient(135deg, #fbe0e9, #ece2fb);
      color: var(--ink-main);
      border: 1.5px solid var(--meringue-pink);
      border-radius: 999px;
      padding: 7px 14px;
      font-weight: 800;
      font-size: 0.86rem;
      cursor: pointer;
    }

    .current-cat-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .current-cat-header img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .current-cat-header h2 {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--ink-main);
    }

    .quick-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .quick-pill {
      background: rgba(255, 255, 255, 0.88);
      border: 1.5px solid var(--border-pastel);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .quick-pill img {
      width: 17px;
      height: 17px;
      object-fit: contain;
    }

    .quick-pill.active {
      background: linear-gradient(135deg, #f8d4e1, #e5d8f8);
      border-color: var(--candy-rose);
    }

    .subcat-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .subcat-btn {
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid var(--border-pastel);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--ink-main);
      cursor: pointer;
    }

    .subcat-btn.active {
      background: linear-gradient(135deg, #f6c9d9, #e1d2f6);
      border-color: var(--candy-rose);
      box-shadow: 0 4px 12px rgba(212, 106, 142, 0.18);
    }

    .toolbar {
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid var(--border-pastel);
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .search-group {
      flex: 1 1 260px;
    }

    input[type="text"] {
      width: 100%;
      padding: 9px 13px;
      border: 1.5px solid var(--border-pastel);
      border-radius: 11px;
      font-size: 0.92rem;
      color: var(--ink-main);
      background: var(--surface-tint);
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--candy-rose);
      background: #ffffff;
    }

    .print-btn {
      background: linear-gradient(135deg, var(--candy-rose), #a5649e);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 8px 15px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1.5px solid var(--border-pastel);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-card);
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-title {
      font-weight: 800;
      font-size: 0.98rem;
      color: var(--ink-main);
    }

    .card-sub {
      font-size: 0.76rem;
      color: var(--ink-soft);
      font-style: italic;
    }

    .tag {
      background: #fce6ee;
      color: var(--berry-deep);
      border: 1px solid var(--meringue-pink);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .img-wrap {
      width: 100%;
      height: 100px;
      border: 1px solid #f7e3eb;
      border-radius: 12px;
      background: linear-gradient(180deg, #fffdfe 0%, #fbf3f8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 5px;
    }

    .img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .img-fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      font-size: 0.66rem;
      color: var(--ink-soft);
      padding: 3px;
      gap: 2px;
      word-break: break-all;
    }

    .img-wrap.missing .img-fallback {
      display: flex;
    }

    .details {
      font-size: 0.84rem;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .footer-meta {
      display: flex;
      gap: 10px;
      font-size: 0.82rem;
      font-weight: 800;
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid #f7e6ee;
    }

    .energy { color: var(--energy-color); }
    .price { color: var(--gold-color); }

    .empty-box {
      background: var(--surface);
      border: 1.5px dashed var(--meringue-pink);
      border-radius: 18px;
      padding: 28px 18px;
      text-align: center;
      color: var(--ink-soft);
      font-weight: 600;
    }


    .subcat-btn.all-btn { background: linear-gradient(135deg, #fff1f6, #f1eafc); }
    .subcat-btn.all-btn.active { background: linear-gradient(135deg, #f6c9d9, #e1d2f6); }

    .section-block { margin-bottom: 22px; }
    .section-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.05rem; font-weight: 700; color: var(--berry-deep);
      margin: 6px 4px 10px;
    }
    .section-title::after {
      content: ""; flex: 1; height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, var(--meringue-pink), transparent);
    }
    .section-title .count {
      font-size: .72rem; font-weight: 600; color: var(--ink-soft);
      background: #fce6ee; border: 1px solid var(--meringue-pink);
      padding: 1px 8px; border-radius: 999px;
    }
    .print-scope { font-size: .8rem; color: var(--ink-soft); font-weight: 500; }
    .back-home-btn, .quick-pill, .subcat-btn, .print-btn { font-family: inherit; }

    /* === IMPRESSION COMPACTE : MAXIMUM DE FICHES PAR PAGE === */
    @media print {
      @page {
        size: A4 portrait;
        margin: 5mm;
      }
      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        font-size: 7.4pt !important;
        line-height: 1.22 !important;
        color: #000000 !important;
      }
      .home-hero,
      .back-home-btn,
      .quick-switcher,
      .subcat-bar,
      .toolbar,
      .print-btn,
      .no-print {
        display: none !important;
      }
      .app-view {
        display: block !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .top-bar {
        border: none !important;
        border-bottom: 1px solid #333 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        padding: 0 0 4px 0 !important;
        margin-bottom: 6px !important;
      }
      .current-cat-header h2 {
        font-size: 10.5pt !important;
      }
      .current-cat-header img {
        width: 16px !important;
        height: 16px !important;
      }
      .section-block { margin-bottom: 6px !important; }
      .section-title {
        font-size: 9pt !important; margin: 4px 0 3px !important; color: #000 !important;
        break-after: avoid; page-break-after: avoid;
      }
      .section-title::after { height: 1px !important; background: #999 !important; }
      .section-title .count { display: none !important; }
      .print-scope { font-size: 8pt !important; color: #000 !important; }
      .grid {
        display: grid !important;
        grid-template-columns: repeat(4, 1fr) !important;
        gap: 5px !important;
      }
      .card {
        border: 0.75px solid #999 !important;
        border-radius: 6px !important;
        padding: 5px 6px !important;
        gap: 3px !important;
        background: #ffffff !important;
        box-shadow: none !important;
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }
      .card-title {
        font-size: 7.8pt !important;
        color: #000000 !important;
      }
      .card-sub {
        font-size: 6.4pt !important;
      }
      .tag {
        font-size: 6.2pt !important;
        padding: 1px 4px !important;
        background: #f5f5f5 !important;
        border-color: #bbb !important;
        color: #000000 !important;
      }
      .img-wrap {
        height: 36px !important;
        padding: 1px !important;
        border: none !important;
        background: #ffffff !important;
      }
      .img-wrap.missing {
        display: none !important;
      }
      .details {
        font-size: 6.8pt !important;
        gap: 1px !important;
      }
      .footer-meta {
        font-size: 6.6pt !important;
        padding-top: 2px !important;
        margin-top: 2px !important;
        gap: 6px !important;
        border-top: 0.5px solid #ddd !important;
      }
    }
  </style>
</head>
<body>

  <!-- ACCUEIL : ILLUSTRATION PLEIN ÉCRAN + BOUTONS PAR-DESSUS -->
  <section id="homeHero" class="home-hero">
    <img class="hero-blur" id="heroBlur" alt="" aria-hidden="true">
    <img class="hero-art" id="heroArt" alt="Disney Dreamlight Valley — The Keepsake Sea">
    <div class="hero-fade"></div>

    <nav class="dock" id="dock" aria-label="Rubriques"></nav>
  </section>

  <!-- VUE DE CATÉGORIE -->
  <div id="appView" class="app-view">
    <div class="top-bar">
      <button class="back-home-btn" id="backHomeBtn">← Accueil</button>
      <div class="current-cat-header" id="currentCatHeader"></div>
      <button class="print-btn" onclick="window.print()">🖨️ Imprimer la sélection</button>
    </div>

    <div class="quick-switcher" id="quickSwitcher"></div>

    <div id="subcatContainer"></div>

    <div class="toolbar">
      <div class="search-group">
        <input type="text" id="searchInput" placeholder="Rechercher dans cette rubrique...">
      </div>
    </div>

    <main id="pageContent"></main>
  </div>

  <script>
    let db = null;
    let currentCat = null;
    let currentSubCat = null;
    let searchText = "";

    const CATEGORIES = [
      { id: "bestioles", label: "Bestioles", icon: "assets/icons/Bestioles_icone.webp", emoji: "🐾" },
      { id: "compagnons", label: "Compagnons", icon: "assets/icons/compagnons_icone.png", emoji: "🐠" },
      { id: "recettes", label: "Recettes", icon: "assets/icons/Cuisine_icone.webp", emoji: "🍽️" },
      { id: "crafting", label: "Crafting", icon: "assets/icons/Artisanat_icone.webp", emoji: "🛠️" },
      { id: "poissons", label: "Poissons", icon: "assets/icons/Poissons.webp", emoji: "🎣" },
      { id: "recoltes", label: "Récoltes", icon: "assets/icons/Cueillette.webp", emoji: "🌸" }
    ];

    const RECETTES_SUBS = ["Hors-d'oeuvre", "Plats principaux", "Desserts"];
    const RECOLTES_SUBS = [
      "sous l'eau",
      "matériaux d'artisanat",
      "fleurs",
      "récupération",
      "ingrédients"
    ];

    const ALL = "__all__";

    // Cherche la première image d'accueil qui existe, puis l'applique au dessin et au fond flou
    function loadHeroImage() {
      const candidates = [
        "images/accueil/keep_sake_sea.jpg",
        "images/accueil/keep_sake_sea.png",
        "images/accueil/keep_sake_sea.webp",
        "images/accueil/keep_sake_sea.jpeg",
        "dlc_mer_des_souvenirs.jpg"
      ];
      (function tryNext(i) {
        if (i >= candidates.length) return;
        const probe = new Image();
        probe.onload = () => {
          document.getElementById("heroArt").src = candidates[i];
          document.getElementById("heroBlur").src = candidates[i];
          document.getElementById("homeHero").classList.add("loaded");
        };
        probe.onerror = () => tryNext(i + 1);
        probe.src = candidates[i];
      })(0);
    }

    function buildDock() {
      const dock = document.getElementById("dock");
      const fb = {
        bestioles: "tryIconExt(this, ['png','jpg'], '🐾')",
        compagnons: "tryIconFallback(this, ['assets/icons/Compagnons_icone.webp','assets/icons/Compagnons_icone.png'], '🐠')",
        recettes: "tryIconExt(this, ['png','jpg'], '🍽️')",
        crafting: "tryIconFallback(this, ['assets/icons/Crafting_icone.webp','assets/icons/Crafting_icone.png'], '🛠️')",
        poissons: "tryIconFallback(this, ['assets/icons/Peche_icone.webp','assets/icons/Poissons.png'], '🎣')",
        recoltes: "tryIconExt(this, ['png','jpg'], '🌸')"
      };
      dock.innerHTML = CATEGORIES.map(c => `
        <button class="tile" data-cat="${c.id}">
          <span class="tile-bubble"><img src="${c.icon}" alt="" onerror="${fb[c.id]}"></span>
          <span class="label">${c.label}</span>
        </button>
      `).join("");
      dock.querySelectorAll(".tile").forEach(btn =>
        btn.addEventListener("click", () => openCategory(btn.dataset.cat)));
    }

    function tryIconExt(imgEl, exts, fallbackEmoji) {
      if (!imgEl.dataset.extIdx) imgEl.dataset.extIdx = "0";
      const idx = parseInt(imgEl.dataset.extIdx, 10);
      if (idx < exts.length) {
        imgEl.dataset.extIdx = String(idx + 1);
        const base = imgEl.src.replace(/\.(webp|png|jpg|jpeg)$/i, "");
        imgEl.src = `${base}.${exts[idx]}`;
      } else {
        imgEl.insertAdjacentHTML("beforebegin", `<span class="tiny-emoji">${fallbackEmoji}</span>`);
        imgEl.remove();
      }
    }

    function tryIconFallback(imgEl, list, fallbackEmoji) {
      if (!imgEl.dataset.fbIdx) imgEl.dataset.fbIdx = "0";
      const idx = parseInt(imgEl.dataset.fbIdx, 10);
      if (idx < list.length) {
        imgEl.dataset.fbIdx = String(idx + 1);
        imgEl.src = list[idx];
      } else {
        imgEl.insertAdjacentHTML("beforebegin", `<span class="tiny-emoji">${fallbackEmoji}</span>`);
        imgEl.remove();
      }
    }

    function normalizeStr(s) {
      return (s || "")
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
    }

    function encodePathSegments(pathStr) {
      return pathStr.split("/").map(seg => encodeURIComponent(seg)).join("/");
    }

    function buildImageCandidates(rawSrc) {
      const nfc = rawSrc.normalize("NFC");
      const nfd = rawSrc.normalize("NFD");
      const forms = nfc === nfd ? [nfc] : [nfc, nfd];
      const baseNoExtList = forms.map(f => f.replace(/\.(webp|png|jpg|jpeg)$/i, ""));
      const origExtMatch = rawSrc.match(/\.(webp|png|jpg|jpeg)$/i);
      const origExt = origExtMatch ? origExtMatch[1].toLowerCase() : "webp";
      const exts = [origExt, "webp", "png", "jpg"].filter((v, i, a) => a.indexOf(v) === i);

      const candidates = [];
      for (const ext of exts) {
        for (const base of baseNoExtList) {
          const full = `${base}.${ext}`;
          candidates.push(encodePathSegments(full));
          candidates.push(encodeURI(full));
        }
      }
      return [...new Set(candidates)];
    }

    function handleImgFallback(imgEl) {
      const list = JSON.parse(imgEl.dataset.candidates || "[]");
      let idx = parseInt(imgEl.dataset.candIdx || "1", 10);
      if (idx < list.length) {
        imgEl.dataset.candIdx = String(idx + 1);
        imgEl.src = list[idx];
      } else {
        imgEl.style.display = "none";
        imgEl.parentElement.classList.add("missing");
      }
    }

    function imgBlock(src, alt) {
      const candidates = buildImageCandidates(src);
      const firstSrc = candidates[0] || encodePathSegments(src);
      const encodedList = JSON.stringify(candidates).replace(/"/g, "&quot;");
      return `
        <div class="img-wrap">
          <img src="${firstSrc}" alt="${alt}" data-candidates="${encodedList}" data-cand-idx="1" onerror="handleImgFallback(this);">
          <div class="img-fallback no-print">
            <span>Image absente</span>
            <code>${src}</code>
          </div>
        </div>
      `;
    }

    function matchesSearch(obj) {
      if (!searchText.trim()) return true;
      const q = normalizeStr(searchText);
      const blob = normalizeStr(JSON.stringify(obj));
      return blob.includes(q);
    }

    function capitalizeFirst(str) {
      return str ? str.charAt(0).toUpperCase() + str.slice(1) : "";
    }

    function openCategory(catId) {
      currentCat = catId;
      searchText = "";
      document.getElementById("searchInput").value = "";

      if (catId === "recettes" || catId === "recoltes") {
        currentSubCat = ALL;
      } else if (catId === "crafting" && db && db.crafting && db.crafting.length) {
        currentSubCat = ALL;
      } else {
        currentSubCat = null;
      }

      document.getElementById("homeHero").classList.add("hidden");
      document.getElementById("appView").classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderCategoryView();
    }

    function backToHome() {
      currentCat = null;
      currentSubCat = null;
      document.getElementById("appView").classList.remove("active");
      document.getElementById("homeHero").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderQuickSwitcher() {
      const switcher = document.getElementById("quickSwitcher");
      switcher.innerHTML = CATEGORIES.map(c => `
        <button class="quick-pill ${c.id === currentCat ? "active" : ""}" data-cat="${c.id}">
          <img src="${c.icon}" alt="" onerror="this.style.display='none'">
          <span>${c.label}</span>
        </button>
      `).join("");

      switcher.querySelectorAll(".quick-pill").forEach(btn => {
        btn.addEventListener("click", () => openCategory(btn.dataset.cat));
      });
    }

    function renderSubCatButtons() {
      const container = document.getElementById("subcatContainer");
      let subs = [];

      if (currentCat === "recettes") {
        subs = RECETTES_SUBS;
      } else if (currentCat === "recoltes") {
        subs = RECOLTES_SUBS;
      } else if (currentCat === "crafting" && db && db.crafting && db.crafting.length) {
        subs = [...new Set(db.crafting.map(c => c.categorie).filter(Boolean))];
      }

      if (!subs.length) {
        container.innerHTML = "";
        return;
      }

      container.innerHTML = `
        <div class="subcat-bar">
          <button class="subcat-btn all-btn ${currentSubCat === ALL ? "active" : ""}" data-sub="${ALL}">✨ Tout</button>
          ${subs.map(sc => `
            <button class="subcat-btn ${sc === currentSubCat ? "active" : ""}" data-sub="${sc.replace(/"/g, "&quot;")}">
              ${capitalizeFirst(sc)}
            </button>
          `).join("")}
        </div>
      `;

      container.querySelectorAll(".subcat-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentSubCat = btn.dataset.sub;
          renderSubCatButtons();
          renderCards();
          updatePrintScope();
        });
      });
    }

    // Affiche les fiches par sous-catégorie.
    // "Tout" (ou une recherche) = toutes les sous-catégories, chacune avec son titre.
    function renderGrouped(target, items, keyFn, orderedSubs, cardFn) {
      const showAll = currentSubCat === ALL || searchText.trim() || !currentSubCat;
      const subs = showAll ? orderedSubs : [currentSubCat];
      const blocks = [];
      subs.forEach(sc => {
        const group = items.filter(it => keyFn(it) === sc);
        if (!group.length) return;
        const grid = `<div class="grid">${group.map(cardFn).join("")}</div>`;
        blocks.push(showAll
          ? `<section class="section-block"><h3 class="section-title">${capitalizeFirst(sc)} <span class="count">${group.length}</span></h3>${grid}</section>`
          : grid);
      });
      if (!blocks.length) {
        const msg = currentCat === "crafting" && !db.crafting.length
          ? "Aucune fabrication ajoutée pour le moment."
          : "Aucun élément trouvé dans cette rubrique.";
        target.innerHTML = `<div class="empty-box">${msg}</div>`;
      } else {
        target.innerHTML = blocks.join("");
      }
    }

    function renderCards() {
      if (!db || !currentCat) return;
      const target = document.getElementById("pageContent");
      let cards = [];

      if (currentCat === "bestioles") {
        cards = db.bestioles.filter(matchesSearch).map(b => `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="card-title">${b.fr}</div>
                <div class="card-sub">${b.lieu}</div>
              </div>
              <span class="tag">${b.comportement}</span>
            </div>
            ${imgBlock(b.image, b.fr)}
            <div class="details">
              <div><strong>Apprivoiser :</strong> ${b.debloquer}</div>
              <div><strong>Approche :</strong> ${b.approche}</div>
              <div><strong>Nourriture préférée :</strong> ${b.preferee}</div>
              <div><strong>Nourriture appréciée :</strong> ${b.appreciee}</div>
              <div><strong>Bonus :</strong> ${b.bonus}</div>
            </div>
          </article>
        `);
      } else if (currentCat === "compagnons") {
        cards = db.compagnons.filter(matchesSearch).map(c => `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="card-title">${c.fr}</div>
                <div class="card-sub">${c.role}</div>
              </div>
              <span class="tag">Compagnon</span>
            </div>
            ${imgBlock(c.image, c.fr)}
            <div class="details">
              <div><strong>Bonus :</strong> ${c.bonus}</div>
              <div><strong>Notes :</strong> ${c.notes}</div>
            </div>
          </article>
        `);
      } else if (currentCat === "recettes") {
        const items = db.recettes.filter(r => matchesSearch(r));
        const card = r => `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="card-title">${r.fr}</div>
                <div class="card-sub">${r.en}</div>
              </div>
              <span class="tag">${"★".repeat(r.stars)}</span>
            </div>
            ${imgBlock(r.image, r.fr)}
            <div class="details">
              <div><strong>Ingrédients :</strong> ${r.ingredients}</div>
            </div>
            <div class="footer-meta">
              <span class="energy">⚡ Énergie : ${r.energy}</span>
              <span class="price">🪙 Vente : ${r.price}</span>
            </div>
          </article>`;
        renderGrouped(target, items, r => r.sous_categorie, RECETTES_SUBS, card);
        return;
      } else if (currentCat === "crafting") {
        const items = db.crafting.filter(cr => matchesSearch(cr));
        const card = cr => `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="card-title">${cr.fr}</div>
                <div class="card-sub">${cr.en || ""}</div>
              </div>
              <span class="tag">${cr.categorie || "Craft"}</span>
            </div>
            ${imgBlock(cr.image, cr.fr)}
            <div class="details">
              <div><strong>Matériaux :</strong> ${cr.ingredients}</div>
            </div>
          </article>`;
        const subs = [...new Set(db.crafting.map(c => c.categorie).filter(Boolean))];
        renderGrouped(target, items, cr => cr.categorie, subs, card);
        return;
      } else if (currentCat === "poissons") {
        cards = db.poissons.filter(matchesSearch).map(p => `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="card-title">${p.fr}</div>
                <div class="card-sub">${p.type}</div>
              </div>
            </div>
            ${imgBlock(p.image, p.fr)}
          </article>
        `);
      } else if (currentCat === "recoltes") {
        const items = db.recoltes.filter(rec => matchesSearch(rec));
        const card = rec => `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="card-title">${rec.fr}</div>
                <div class="card-sub">${capitalizeFirst(rec.categorie)}</div>
              </div>
            </div>
            ${imgBlock(rec.image, rec.fr)}
          </article>`;
        renderGrouped(target, items, rec => rec.categorie, RECOLTES_SUBS, card);
        return;
      }

      if (!cards.length) {
        const emptyMsg = currentCat === "crafting" && !db.crafting.length
          ? "Aucune fabrication ajoutée pour le moment."
          : "Aucun élément trouvé dans cette rubrique.";
        target.innerHTML = `<div class="empty-box">${emptyMsg}</div>`;
      } else {
        target.innerHTML = `<div class="grid">${cards.join("")}</div>`;
      }
    }

    function renderCategoryView() {
      const catMeta = CATEGORIES.find(c => c.id === currentCat);
      document.getElementById("currentCatHeader").innerHTML = `
        <img src="${catMeta.icon}" alt="" onerror="this.style.display='none'">
        <h2>${catMeta.label}</h2>
        <span class="print-scope" id="printScope"></span>
      `;
      renderQuickSwitcher();
      renderSubCatButtons();
      renderCards();
      updatePrintScope();
    }

    function updatePrintScope() {
      const el = document.getElementById("printScope");
      if (!el) return;
      el.textContent = (currentSubCat && currentSubCat !== ALL) ? "· " + capitalizeFirst(currentSubCat)
                     : (currentSubCat === ALL ? "· Tout" : "");
    }

    fetch("data.json")
      .then(r => r.json())
      .then(data => {
        db = data;
      });

    buildDock();
    loadHeroImage();

    document.getElementById("backHomeBtn").addEventListener("click", backToHome);

    document.getElementById("searchInput").addEventListener("input", e => {
      searchText = e.target.value;
      renderCards();
    });
  </script>
</body>
</html>
