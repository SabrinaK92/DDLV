<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disney Dreamlight Valley — The Keepsake Sea</title>
  <style>
    :root {
      /* Palette inspirée de keep_sake_sea.jpg : meringue rose, ciel pastel, lavande douce */
      --bg-top: #fdf1f5;
      --bg-mid: #f5ecfb;
      --bg-bottom: #eef4fc;
      --surface: #ffffff;
      --surface-tint: #fff8fa;
      --meringue-pink: #f7cad7;
      --candy-rose: #d46a8e;
      --berry-deep: #8f3b5b;
      --pastel-sky: #cfe0f7;
      --pastel-lilac: #e3d6f7;
      --ink-main: #351d2b;
      --ink-soft: #785568;
      --border-pastel: #f0cedb;
      --shadow-card: 0 6px 18px rgba(143, 59, 91, 0.09);
      --energy-color: #4f78b5;
      --gold-color: #b57c35;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(165deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bottom) 100%);
      color: var(--ink-main);
      min-height: 100vh;
      line-height: 1.45;
    }

    /* === ÉCRAN D'ACCUEIL : IMAGE NETTE + BOUTONS COMPACTS & ÉLÉGANTS === */
    .home-screen {
      max-width: 1040px;
      margin: 0 auto;
      padding: 22px 16px 40px;
    }

    .home-banner-card {
      position: relative;
      border-radius: 26px;
      overflow: hidden;
      border: 2px solid var(--meringue-pink);
      box-shadow: 0 14px 34px rgba(143, 59, 91, 0.14);
      background: linear-gradient(135deg, #f8d6e2 0%, #e7daf8 50%, #d8e8fb 100%);
      display: grid;
      grid-template-columns: minmax(240px, 340px) 1fr;
      align-items: center;
      gap: 20px;
      padding: 18px;
    }

    .artwork-frame {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 8px 22px rgba(53, 29, 43, 0.14);
      background: #fcebf1;
      aspect-ratio: 4 / 5;
      max-height: 390px;
      width: 100%;
    }

    /* Image 100% nette, sans flou */
    .artwork-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      filter: none;
    }

    .home-right-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 4px 6px;
    }

    .home-title-box {
      background: rgba(255, 255, 255, 0.82);
      border: 1.5px solid var(--border-pastel);
      border-radius: 20px;
      padding: 14px 18px;
    }

    .home-kicker {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--berry-deep);
      background: var(--meringue-pink);
      padding: 3px 11px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .home-title-box h1 {
      font-size: clamp(1.35rem, 2.5vw, 1.85rem);
      font-weight: 800;
      color: var(--ink-main);
    }

    .home-title-box p {
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--berry-deep);
      margin-top: 2px;
    }

    /* Grille de boutons compacts : taille équilibrée, pas d'énormes cartes */
    .compact-nav-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .compact-btn {
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid var(--border-pastel);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 4px 12px rgba(143, 59, 91, 0.07);
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .compact-btn:hover {
      transform: translateY(-2px);
      background: #ffffff;
      border-color: var(--candy-rose);
      box-shadow: 0 7px 16px rgba(143, 59, 91, 0.14);
    }

    .compact-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #fde4ec, #ece2fb);
      border: 1px solid var(--meringue-pink);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .compact-icon img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .compact-icon .emoji-fallback {
      font-size: 1.25rem;
      line-height: 1;
    }

    .compact-label {
      font-size: 0.96rem;
      font-weight: 800;
      color: var(--ink-main);
    }

    /* === VUE DE CATÉGORIE === */
    .app-view {
      display: none;
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 16px 48px;
    }

    .app-view.active {
      display: block;
    }

    .home-screen.hidden {
      display: none;
    }

    .top-bar {
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid var(--border-pastel);
      border-radius: 20px;
      padding: 12px 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .back-home-btn {
      background: linear-gradient(135deg, #fbe0e9, #ece2fb);
      color: var(--ink-main);
      border: 1.5px solid var(--meringue-pink);
      border-radius: 12px;
      padding: 8px 14px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .back-home-btn:hover {
      border-color: var(--candy-rose);
    }

    .current-cat-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .current-cat-header img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .current-cat-header h2 {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--ink-main);
    }

    .quick-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .quick-pill {
      background: rgba(255, 255, 255, 0.88);
      border: 1.5px solid var(--border-pastel);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .quick-pill img {
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .quick-pill.active {
      background: linear-gradient(135deg, #f8d4e1, #e5d8f8);
      border-color: var(--candy-rose);
    }

    /* Boutons de sous-catégories */
    .subcat-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .subcat-btn {
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid var(--border-pastel);
      border-radius: 14px;
      padding: 9px 15px;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--ink-main);
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .subcat-btn:hover {
      border-color: var(--candy-rose);
      background: #ffffff;
    }

    .subcat-btn.active {
      background: linear-gradient(135deg, #f6c9d9, #e1d2f6);
      border-color: var(--candy-rose);
      color: var(--ink-main);
      box-shadow: 0 4px 12px rgba(212, 106, 142, 0.18);
    }

    .toolbar {
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid var(--border-pastel);
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .search-group {
      flex: 1 1 260px;
    }

    input[type="text"] {
      width: 100%;
      padding: 9px 13px;
      border: 1.5px solid var(--border-pastel);
      border-radius: 11px;
      font-size: 0.92rem;
      color: var(--ink-main);
      background: var(--surface-tint);
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--candy-rose);
      background: #ffffff;
    }

    .print-btn {
      background: linear-gradient(135deg, var(--candy-rose), #a5649e);
      color: #ffffff;
      border: none;
      border-radius: 11px;
      padding: 9px 14px;
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1.5px solid var(--border-pastel);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      box-shadow: var(--shadow-card);
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-title {
      font-weight: 800;
      font-size: 1rem;
      color: var(--ink-main);
    }

    .card-sub {
      font-size: 0.78rem;
      color: var(--ink-soft);
      font-style: italic;
    }

    .tag {
      background: #fce6ee;
      color: var(--berry-deep);
      border: 1px solid var(--meringue-pink);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .img-wrap {
      width: 100%;
      height: 104px;
      border: 1px solid #f7e3eb;
      border-radius: 13px;
      background: linear-gradient(180deg, #fffdfe 0%, #fbf3f8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 6px;
    }

    .img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .img-fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      font-size: 0.68rem;
      color: var(--ink-soft);
      padding: 4px;
      gap: 2px;
      word-break: break-all;
    }

    .img-wrap.missing .img-fallback {
      display: flex;
    }

    .details {
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .footer-meta {
      display: flex;
      gap: 12px;
      font-size: 0.83rem;
      font-weight: 800;
      margin-top: auto;
      padding-top: 7px;
      border-top: 1px solid #f7e6ee;
    }

    .energy { color: var(--energy-color); }
    .price { color: var(--gold-color); }

    .empty-box {
      background: var(--surface);
      border: 1.5px dashed var(--meringue-pink);
      border-radius: 18px;
      padding: 28px 18px;
      text-align: center;
      color: var(--ink-soft);
      font-weight: 600;
    }

    @media (max-width: 740px) {
      .home-banner-card {
        grid-template-columns: 1fr;
      }
      .artwork-frame {
        max-width: 270px;
        margin: 0 auto;
        max-height: 310px;
      }
    }

    @media (max-width: 460px) {
      .compact-nav-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      @page { size: A5 portrait; margin: 8mm; }
      body { background: #ffffff !important; padding: 0; font-size: 9pt; color: #000000; }
      .home-screen, .back-home-btn, .quick-switcher, .subcat-bar, .toolbar, .no-print { display: none !important; }
      .app-view { display: block !important; padding: 0; }
      .top-bar { border: 1px solid #000000; box-shadow: none; padding: 8px 12px; margin-bottom: 10px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .card { border: 1px solid #94a3b8; padding: 8px; background: #ffffff !important; box-shadow: none; }
      .card-title { color: #000000 !important; }
      .img-wrap { height: 62px; border: none; background: #ffffff !important; }
      .img-wrap.missing { display: none; }
    }
  </style>
</head>
<body>

  <!-- ÉCRAN D'ACCUEIL -->
  <section id="homeScreen" class="home-screen">
    <div class="home-banner-card">
      <div class="artwork-frame">
        <img src="images/accueil/keep_sake_sea.jpg" alt="Disney Dreamlight Valley — The Keepsake Sea" onerror="handleWelcomeImgError(this);">
      </div>

      <div class="home-right-panel">
        <div class="home-title-box">
          <span class="home-kicker">The Keepsake Sea</span>
          <h1>Disney Dreamlight Valley</h1>
          <p>La Mer des Souvenirs</p>
        </div>

        <div class="compact-nav-grid" id="compactNavGrid">
          <button class="compact-btn" data-cat="bestioles">
            <span class="compact-icon">
              <img src="assets/icons/Bestioles_icone.webp" alt="" onerror="tryIconExt(this, ['png', 'jpg'], '🐾');">
            </span>
            <span class="compact-label">Bestioles</span>
          </button>

          <button class="compact-btn" data-cat="compagnons">
            <span class="compact-icon">
              <img src="assets/icons/compagnons_icone.png" alt="" onerror="tryIconFallback(this, ['assets/icons/Compagnons_icone.webp', 'assets/icons/Compagnons_icone.png'], '🐠');">
            </span>
            <span class="compact-label">Compagnons</span>
          </button>

          <button class="compact-btn" data-cat="recettes">
            <span class="compact-icon">
              <img src="assets/icons/Cuisine_icone.webp" alt="" onerror="tryIconExt(this, ['png', 'jpg'], '🍽️');">
            </span>
            <span class="compact-label">Recettes</span>
          </button>

          <button class="compact-btn" data-cat="crafting">
            <span class="compact-icon">
              <img src="assets/icons/Artisanat_icone.webp" alt="" onerror="tryIconFallback(this, ['assets/icons/Crafting_icone.webp', 'assets/icons/Crafting_icone.png'], '🛠️');">
            </span>
            <span class="compact-label">Crafting</span>
          </button>

          <button class="compact-btn" data-cat="poissons">
            <span class="compact-icon">
              <img src="assets/icons/Poissons.webp" alt="" onerror="tryIconFallback(this, ['assets/icons/Peche_icone.webp', 'assets/icons/Poissons.png'], '🎣');">
            </span>
            <span class="compact-label">Poissons</span>
          </button>

          <button class="compact-btn" data-cat="recoltes">
            <span class="compact-icon">
              <img src="assets/icons/Cueillette.webp" alt="" onerror="tryIconExt(this, ['png', 'jpg'], '🌸');">
            </span>
            <span class="compact-label">Récoltes</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- VUE DE CATÉGORIE -->
  <div id="appView" class="app-view">
    <div class="top-bar">
      <button class="back-home-btn" id="backHomeBtn">← Accueil</button>
      <div class="current-cat-header" id="currentCatHeader"></div>
      <button class="print-btn" onclick="window.print()">🖨️ Imprimer en livret A5</button>
    </div>

    <div class="quick-switcher" id="quickSwitcher"></div>

    <div id="subcatContainer"></div>

    <div class="toolbar">
      <div class="search-group">
        <input type="text" id="searchInput" placeholder="Rechercher dans cette rubrique...">
      </div>
    </div>

    <main id="pageContent"></main>
  </div>

  <script>
    let db = null;
    let currentCat = null;
    let currentSubCat = null;
    let searchText = "";

    const CATEGORIES = [
      { id: "bestioles", label: "Bestioles", icon: "assets/icons/Bestioles_icone.webp", alts: ["assets/icons/Bestioles_icone.png"], emoji: "🐾" },
      { id: "compagnons", label: "Compagnons", icon: "assets/icons/compagnons_icone.png", alts: ["assets/icons/Compagnons_icone.webp"], emoji: "🐠" },
      { id: "recettes", label: "Recettes", icon: "assets/icons/Cuisine_icone.webp", alts: ["assets/icons/Cuisine_icone.png"], emoji: "🍽️" },
      { id: "crafting", label: "Crafting", icon: "assets/icons/Artisanat_icone.webp", alts: ["assets/icons/Crafting_icone.webp"], emoji: "🛠️" },
      { id: "poissons", label: "Poissons", icon: "assets/icons/Poissons.webp", alts: ["assets/icons/Peche_icone.webp"], emoji: "🎣" },
      { id: "recoltes", label: "Récoltes", icon: "assets/icons/Cueillette.webp", alts: ["assets/icons/Cueillette.png"], emoji: "🌸" }
    ];

    const RECETTES_SUBS = ["Hors-d'oeuvre", "Plats principaux", "Desserts"];
    const RECOLTES_SUBS = [
      "sous l'eau",
      "matériaux d'artisanat",
      "fleurs",
      "récupération",
      "ingrédients"
    ];

    function handleWelcomeImgError(imgEl) {
      if (!imgEl.dataset.step) imgEl.dataset.step = "0";
      const step = parseInt(imgEl.dataset.step, 10);
      const fallbacks = [
        "images/accueil/keep_sake_sea.png",
        "images/accueil/keep_sake_sea.webp",
        "dlc_mer_des_souvenirs.jpg"
      ];
      if (step < fallbacks.length) {
        imgEl.dataset.step = String(step + 1);
        imgEl.src = fallbacks[step];
      }
    }

    function tryIconExt(imgEl, exts, fallbackEmoji) {
      if (!imgEl.dataset.extIdx) imgEl.dataset.extIdx = "0";
      const idx = parseInt(imgEl.dataset.extIdx, 10);
      if (idx < exts.length) {
        imgEl.dataset.extIdx = String(idx + 1);
        const base = imgEl.src.replace(/\.(webp|png|jpg|jpeg)$/i, "");
        imgEl.src = `${base}.${exts[idx]}`;
      } else {
        imgEl.parentElement.innerHTML = `<span class="emoji-fallback">${fallbackEmoji}</span>`;
      }
    }

    function tryIconFallback(imgEl, list, fallbackEmoji) {
      if (!imgEl.dataset.fbIdx) imgEl.dataset.fbIdx = "0";
      const idx = parseInt(imgEl.dataset.fbIdx, 10);
      if (idx < list.length) {
        imgEl.dataset.fbIdx = String(idx + 1);
        imgEl.src = list[idx];
      } else {
        imgEl.parentElement.innerHTML = `<span class="emoji-fallback">${fallbackEmoji}</span>`;
      }
    }

    function normalizeStr(s) {
      return (s || "")
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
    }

    function buildImageCandidates(rawSrc) {
      const nfc = rawSrc.normalize("NFC");
      const nfd = rawSrc.normalize("NFD");
      const forms = nfc === nfd ? [nfc] : [nfc, nfd];
      const baseNoExtList = forms.map(f => f.replace(/\.(webp|png|jpg|jpeg)$/i, ""));
      const origExtMatch = rawSrc.match(/\.(webp|png|jpg|jpeg)$/i);
      const origExt = origExtMatch ? origExtMatch[1].toLowerCase() : "webp";
      const exts = [origExt, "webp", "png", "jpg"].filter((v, i, a) => a.indexOf(v) === i);

      const candidates = [];
      for (const ext of exts) {
        for (const base of baseNoExtList) {
          candidates.push(encodeURI(`${base}.${ext}`));
        }
      }
      return candidates;
    }

    function handleImgFallback(imgEl) {
      const list = JSON.parse(imgEl.dataset.candidates || "[]");
      let idx = parseInt(imgEl.dataset.candIdx || "1", 10);
      if (idx < list.length) {
        imgEl.dataset.candIdx = String(idx + 1);
        imgEl.src = list[idx];
      } else {
        imgEl.style.display = "none";
        imgEl.parentElement.classList.add("missing");
      }
    }

    function imgBlock(src, alt) {
      const candidates = buildImageCandidates(src);
      const firstSrc = candidates[0] || encodeURI(src);
      const encodedList = JSON.stringify(candidates).replace(/"/g, "&quot;");
      return `
        <div class="img-wrap">
          <img src="${firstSrc}" alt="${alt}" data-candidates="${encodedList}" data-cand-idx="1" onerror="handleImgFallback(this);">
          <div class="img-fallback no-print">
            <span>Image absente</span>
            <code>${src}</code>
          </div>
        </div>
      `;
    }

    function matchesSearch(obj) {
      if (!searchText.trim()) return true;
      const q = normalizeStr(searchText);
      const blob = normalizeStr(JSON.stringify(obj));
      return blob.includes(q);
    }

    function capitalizeFirst(str) {
      return str ? str.charAt(0).toUpperCase() + str.slice(1) : "";
    }

    function openCategory(catId) {
      currentCat = catId;
      searchText = "";
      document.getElementById("searchInput").value = "";

      if (catId === "recettes") {
        currentSubCat = RECETTES_SUBS[0];
      } else if (catId === "recoltes") {
        currentSubCat = RECOLTES_SUBS[0];
      } else if (catId === "crafting" && db && db.crafting && db.crafting.length) {
        const craftCats = [...new Set(db.crafting.map(c => c.categorie).filter(Boolean))];
        currentSubCat = craftCats[0] || null;
      } else {
        currentSubCat = null;
      }

      document.getElementById("homeScreen").classList.add("hidden");
      document.getElementById("appView").classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderCategoryView();
    }

    function backToHome() {
      currentCat = null;
      currentSubCat = null;
      document.getElementById("appView").classList.remove("active");
      document.getElementById("homeScreen").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderQuickSwitcher() {
      const switcher = document.getElementById("quickSwitcher");
      switcher.innerHTML = CATEGORIES.map(c => `
        <button class="quick-pill ${c.id === currentCat ? "active" : ""}" data-cat="${c.id}">
          <img src="${c.icon}" alt="" onerror="this.style.display='none'">
          <span>${c.label}</span>
        </button>
      `).join("");

      switcher.querySelectorAll(".quick-pill").forEach(btn => {
        btn.addEventListener("click", () => openCategory(btn.dataset.cat));
      });
    }

    function renderSubCatButtons() {
      const container = document.getElementById("subcatContainer");
      let subs = [];

      if (currentCat === "recettes") {
        subs = RECETTES_SUBS;
      } else if (currentCat === "recoltes") {
        subs = RECOLTES_SUBS;
      } else if (currentCat === "crafting" && db && db.crafting && db.crafting.length) {
        subs = [...new Set(db.crafting.map(c => c.categorie).filter(Boolean))];
      }

      if (!subs.length) {
        container.innerHTML = "";
        return;
      }

      container.innerHTML = `
        <div class="subcat-bar">
          ${subs.map(sc => `
            <button class="subcat-btn ${sc === currentSubCat ? "active" : ""}" data-sub="${sc.replace(/"/g, "&quot;")}">
              ${capitalizeFirst(sc)}
            </button>
          `).join("")}
        </div>
      `;

      container.querySelectorAll(".subcat-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentSubCat = btn.dataset.sub;
          renderSubCatButtons();
          renderCards();
        });
      });
    }

    function renderCards() {
      if (!db || !currentCat) return;
      const target = document.getElementById("pageContent");
      let cards = [];

      if (currentCat === "bestioles") {
        cards = db.bestioles.filter(matchesSearch).map(b => `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="card-title">${b.fr}</div>
                <div class="card-sub">${b.lieu}</div>
              </div>
              <span class="tag">${b.comportement}</span>
            </div>
            ${imgBlock(b.image, b.fr)}
            <div class="details">
              <div><strong>Apprivoiser :</strong> ${b.debloquer}</div>
              <div><strong>Approche :</strong> ${b.approche}</div>
              <div><strong>Nourriture préférée :</strong> ${b.preferee}</div>
              <div><strong>Nourriture appréciée :</strong> ${b.appreciee}</div>
              <div><strong>Bonus :</strong> ${b.bonus}</div>
            </div>
          </article>
        `);
      } else if (currentCat === "compagnons") {
        cards = db.compagnons.filter(matchesSearch).map(c => `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="card-title">${c.fr}</div>
                <div class="card-sub">${c.role}</div>
              </div>
              <span class="tag">Compagnon</span>
            </div>
            ${imgBlock(c.image, c.fr)}
            <div class="details">
              <div><strong>Bonus :</strong> ${c.bonus}</div>
              <div><strong>Notes :</strong> ${c.notes}</div>
            </div>
          </article>
        `);
      } else if (currentCat === "recettes") {
        const filtered = db.recettes.filter(r =>
          (searchText.trim() ? true : r.sous_categorie === currentSubCat) && matchesSearch(r)
        );
        cards = filtered.map(r => `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="card-title">${r.fr}</div>
                <div class="card-sub">${r.en}</div>
              </div>
              <span class="tag">${"★".repeat(r.stars)}</span>
            </div>
            ${imgBlock(r.image, r.fr)}
            <div class="details">
              <div><strong>Ingrédients :</strong> ${r.ingredients}</div>
            </div>
            <div class="footer-meta">
              <span class="energy">⚡ Énergie : ${r.energy}</span>
              <span class="price">🪙 Vente : ${r.price}</span>
            </div>
          </article>
        `);
      } else if (currentCat === "crafting") {
        const filtered = db.crafting.filter(cr =>
          (!currentSubCat || searchText.trim() ? true : cr.categorie === currentSubCat) && matchesSearch(cr)
        );
        cards = filtered.map(cr => `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="card-title">${cr.fr}</div>
                <div class="card-sub">${cr.en || ""}</div>
              </div>
              <span class="tag">${cr.categorie || "Craft"}</span>
            </div>
            ${imgBlock(cr.image, cr.fr)}
            <div class="details">
              <div><strong>Matériaux :</strong> ${cr.ingredients}</div>
            </div>
          </article>
        `);
      } else if (currentCat === "poissons") {
        cards = db.poissons.filter(matchesSearch).map(p => `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="card-title">${p.fr}</div>
                <div class="card-sub">${p.type}</div>
              </div>
            </div>
            ${imgBlock(p.image, p.fr)}
          </article>
        `);
      } else if (currentCat === "recoltes") {
        const filtered = db.recoltes.filter(rec =>
          (searchText.trim() ? true : rec.categorie === currentSubCat) && matchesSearch(rec)
        );
        cards = filtered.map(rec => `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="card-title">${rec.fr}</div>
                <div class="card-sub">${capitalizeFirst(rec.categorie)}</div>
              </div>
            </div>
            ${imgBlock(rec.image, rec.fr)}
          </article>
        `);
      }

      if (!cards.length) {
        const emptyMsg = currentCat === "crafting" && !db.crafting.length
          ? "Aucune fabrication ajoutée pour le moment."
          : "Aucun élément trouvé dans cette rubrique.";
        target.innerHTML = `<div class="empty-box">${emptyMsg}</div>`;
      } else {
        target.innerHTML = `<div class="grid">${cards.join("")}</div>`;
      }
    }

    function renderCategoryView() {
      const catMeta = CATEGORIES.find(c => c.id === currentCat);
      document.getElementById("currentCatHeader").innerHTML = `
        <img src="${catMeta.icon}" alt="" onerror="this.style.display='none'">
        <h2>${catMeta.label}</h2>
      `;
      renderQuickSwitcher();
      renderSubCatButtons();
      renderCards();
    }

    fetch("data.json")
      .then(r => r.json())
      .then(data => {
        db = data;
      });

    document.querySelectorAll(".compact-btn").forEach(btn => {
      btn.addEventListener("click", () => openCategory(btn.dataset.cat));
    });

    document.getElementById("backHomeBtn").addEventListener("click", backToHome);

    document.getElementById("searchInput").addEventListener("input", e => {
      searchText = e.target.value;
      renderCards();
    });
  </script>
</body>
</html>
