<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disney Dreamlight Valley — La Mer des Souvenirs</title>
  <style>
    :root {
      --ddlv-sky: #2d5fa8;
      --ddlv-royal: #3b76c9;
      --ddlv-champagne: #d4af37;
      --ddlv-champagne-soft: #f5e6b3;
      --ddlv-ivory: #faf8f2;
      --ddlv-surface: #ffffff;
      --ddlv-ink: #1b2845;
      --ddlv-muted: #52607a;
      --ddlv-border: #d8dee9;
      --ddlv-energy: #1d70b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--ddlv-ivory);
      color: var(--ddlv-ink);
      line-height: 1.45;
      padding: 16px;
    }

    .container { max-width: 1180px; margin: 0 auto; }

    .home-hero {
      position: relative;
      border-radius: 18px;
      padding: 28px 22px;
      margin-bottom: 18px;
      border: 2px solid var(--ddlv-champagne);
      overflow: hidden;
      background: linear-gradient(135deg, rgba(45, 95, 168, 0.78), rgba(59, 118, 201, 0.72));
      color: #ffffff;
      text-align: center;
      box-shadow: 0 6px 20px rgba(27, 40, 69, 0.08);
    }

    .home-bg-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .home-bg-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.34;
    }

    .home-hero-content {
      position: relative;
      z-index: 1;
    }

    .home-hero h1 {
      font-size: 1.75rem;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
    }

    .home-hero p {
      color: #f8fafc;
      margin-top: 4px;
      font-size: 0.96rem;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    .dlc-status-note {
      display: none;
      margin: 10px auto 0;
      max-width: 520px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.18);
      font-size: 0.78rem;
      color: #fef9e7;
    }

    .dlc-status-note.visible { display: block; }

    .main-nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.94);
      color: var(--ddlv-ink);
      border: 2px solid rgba(212, 175, 55, 0.65);
      border-radius: 12px;
      padding: 10px 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      border-color: var(--ddlv-champagne);
      background: #ffffff;
    }

    .nav-btn.active {
      background: var(--ddlv-champagne-soft);
      color: var(--ddlv-ink);
      border-color: var(--ddlv-champagne);
      box-shadow: inset 0 0 0 1px var(--ddlv-champagne);
    }

    .nav-icon-wrap {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-icon-wrap img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .nav-emoji {
      font-size: 1.25rem;
      line-height: 1;
    }

    .toolbar {
      background: var(--ddlv-surface);
      border: 1px solid var(--ddlv-border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }

    .search-group { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 360px; }

    input[type="text"] {
      flex: 1 1 240px;
      padding: 9px 12px;
      border: 1px solid var(--ddlv-border);
      border-radius: 8px;
      font-size: 0.92rem;
      color: var(--ddlv-ink);
      background: #ffffff;
    }

    .print-btn {
      background: var(--ddlv-royal);
      color: #ffffff;
      border: 1px solid var(--ddlv-champagne);
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .welcome-panel {
      background: var(--ddlv-surface);
      border: 1px solid var(--ddlv-border);
      border-left: 4px solid var(--ddlv-champagne);
      border-radius: 12px;
      padding: 18px;
      color: var(--ddlv-muted);
      font-size: 0.94rem;
    }

    .welcome-panel strong { color: var(--ddlv-ink); }

    .section-title {
      font-size: 1.22rem;
      color: var(--ddlv-ink);
      margin: 20px 0 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--ddlv-champagne);
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(265px, 1fr)); gap: 14px; }

    .card {
      background: var(--ddlv-surface);
      border: 1px solid var(--ddlv-border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-title { font-weight: 700; font-size: 1rem; color: var(--ddlv-ink); }
    .card-sub { font-size: 0.78rem; color: var(--ddlv-muted); font-style: italic; }

    .tag {
      background: var(--ddlv-champagne-soft);
      color: #6b5310;
      border: 1px solid var(--ddlv-champagne);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .img-wrap {
      width: 100%;
      height: 98px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .img-fallback { display: none; flex-direction: column; align-items: center; text-align: center; font-size: 0.72rem; color: var(--ddlv-muted); padding: 6px; gap: 2px; }
    .img-wrap.missing .img-fallback { display: flex; }

    .details { font-size: 0.86rem; display: flex; flex-direction: column; gap: 3px; }
    .footer-meta {
      display: flex;
      gap: 12px;
      font-size: 0.84rem;
      font-weight: 700;
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid #f1f5f9;
    }
    .energy { color: var(--ddlv-energy); }
    .price { color: #9a7412; }

    .empty-box {
      background: var(--ddlv-surface);
      border: 1px dashed var(--ddlv-border);
      border-radius: 12px;
      padding: 22px;
      text-align: center;
      color: var(--ddlv-muted);
    }

    @media print {
      @page { size: A5 portrait; margin: 8mm; }
      body { background: #ffffff !important; padding: 0; font-size: 9pt; }
      .home-hero { background: #ffffff !important; color: #000000 !important; border: 1px solid #000000; padding: 10px; margin-bottom: 8px; box-shadow: none; }
      .home-bg-layer, .dlc-status-note, .main-nav, .toolbar, .no-print { display: none !important; }
      .home-hero h1, .home-hero p { color: #000000 !important; text-shadow: none; }
      .section-title { color: #000000 !important; border-bottom: 1px solid #000000; font-size: 11pt; margin: 10px 0 6px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .card { border: 1px solid #94a3b8; padding: 8px; background: #ffffff !important; }
      .card-title { color: #000000 !important; }
      .img-wrap { height: 62px; border: none; }
      .img-wrap.missing { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="home-hero">
      <div class="home-bg-layer">
        <img id="dlcBgImg" src="dlc_mer_des_souvenirs.jpg" alt="La Mer des Souvenirs" onerror="handleDlcBgError(this);">
      </div>

      <div class="home-hero-content">
        <h1>Disney Dreamlight Valley</h1>
        <p>La Mer des Souvenirs</p>
        <div id="dlcStatusNote" class="dlc-status-note no-print">
          Image du DLC attendue : <code>dlc_mer_des_souvenirs.jpg</code> (ou <code>images/accueil/dlc_mer_des_souvenirs.jpg</code>)
        </div>

        <nav class="main-nav" aria-label="Navigation principale">
          <button class="nav-btn active" data-page="accueil">
            <span class="nav-icon-wrap" data-icon-base="accueil">
              <span class="nav-emoji">🏠</span>
            </span>
            <span>Accueil</span>
          </button>

          <button class="nav-btn" data-page="bestioles">
            <span class="nav-icon-wrap" data-icon-base="Bestioles_icone">
              <img src="assets/icons/Bestioles_icone.webp" alt="" onerror="tryIconExt(this, ['png', 'jpg'], '🐾');">
            </span>
            <span>Bestioles</span>
          </button>

          <button class="nav-btn" data-page="compagnons">
            <span class="nav-icon-wrap" data-icon-base="Compagnons_icone">
              <img src="assets/icons/Compagnons_icone.webp" alt="" onerror="tryIconExt(this, ['png', 'jpg'], '🤝');">
            </span>
            <span>Compagnons</span>
          </button>

          <button class="nav-btn" data-page="recettes">
            <span class="nav-icon-wrap" data-icon-base="Cuisine_icone">
              <img src="assets/icons/Cuisine_icone.webp" alt="" onerror="tryIconExt(this, ['png', 'jpg'], '🍽️');">
            </span>
            <span>Recettes</span>
          </button>

          <button class="nav-btn" data-page="crafting">
            <span class="nav-icon-wrap" data-icon-base="Crafting_icone">
              <img src="assets/icons/Crafting_icone.webp" alt="" onerror="tryIconExt(this, ['png', 'jpg'], '🛠️');">
            </span>
            <span>Crafting</span>
          </button>

          <button class="nav-btn" data-page="poissons">
            <span class="nav-icon-wrap" data-icon-base="Poissons">
              <img src="assets/icons/Poissons.webp" alt="" onerror="tryIconExt(this, ['png', 'jpg'], '🎣');">
            </span>
            <span>Poissons</span>
          </button>

          <button class="nav-btn" data-page="recoltes">
            <span class="nav-icon-wrap" data-icon-base="Cueillette">
              <img src="assets/icons/Cueillette.webp" alt="" onerror="tryIconExt(this, ['png', 'jpg'], '🌿');">
            </span>
            <span>Récoltes</span>
          </button>
        </nav>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-group">
        <input type="text" id="searchInput" placeholder="Rechercher par nom, ingrédient, énergie, prix...">
      </div>
      <button class="print-btn" onclick="window.print()">🖨️ Imprimer en livret A5 (Fond blanc)</button>
    </div>

    <main id="pageContent"></main>
  </div>

  <script>
    let db = null;
    let currentPage = "accueil";
    let searchText = "";

    function handleDlcBgError(imgEl) {
      if (!imgEl.dataset.triedSub) {
        imgEl.dataset.triedSub = "1";
        imgEl.src = "images/accueil/dlc_mer_des_souvenirs.jpg";
        return;
      }
      imgEl.style.display = "none";
      document.getElementById("dlcStatusNote").classList.add("visible");
    }

    function tryIconExt(imgEl, exts, fallbackEmoji) {
      if (!imgEl.dataset.extIdx) imgEl.dataset.extIdx = "0";
      const idx = parseInt(imgEl.dataset.extIdx, 10);
      if (idx < exts.length) {
        imgEl.dataset.extIdx = String(idx + 1);
        const base = imgEl.src.replace(/\.(webp|png|jpg|jpeg)$/i, "");
        imgEl.src = `${base}.${exts[idx]}`;
      } else {
        imgEl.parentElement.innerHTML = `<span class="nav-emoji">${fallbackEmoji}</span>`;
      }
    }

    function normalizeStr(s) {
      return (s || "")
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
    }

    function tryAltExt(imgEl, exts) {
      if (!imgEl.dataset.extIndex) imgEl.dataset.extIndex = "0";
      const idx = parseInt(imgEl.dataset.extIndex, 10);
      if (idx < exts.length) {
        imgEl.dataset.extIndex = String(idx + 1);
        const base = imgEl.src.replace(/\.(webp|png|jpg|jpeg)$/i, "");
        imgEl.src = `${base}.${exts[idx]}`;
      } else {
        imgEl.style.display = "none";
        imgEl.parentElement.classList.add("missing");
      }
    }

    function imgBlock(src, alt) {
      const encoded = encodeURI(src);
      return `
        <div class="img-wrap">
          <img src="${encoded}" alt="${alt}" onerror="tryAltExt(this, ['webp', 'png', 'jpg']);">
          <div class="img-fallback no-print">
            <span>Image absente</span>
            <code>${src}</code>
          </div>
        </div>
      `;
    }

    function matchesSearch(obj) {
      if (!searchText.trim()) return true;
      const q = normalizeStr(searchText);
      const blob = normalizeStr(JSON.stringify(obj));
      return blob.includes(q);
    }

    function buildSection(title, cardsHtml, emptyText) {
      if (!cardsHtml.length) {
        return `
          <section>
            <h2 class="section-title">${title}</h2>
            <div class="empty-box">${emptyText || "Aucun élément pour le moment."}</div>
          </section>
        `;
      }
      return `
        <section>
          <h2 class="section-title">${title}</h2>
          <div class="grid">${cardsHtml.join("")}</div>
        </section>
      `;
    }

    function renderBestioles(list) {
      const items = list.filter(matchesSearch).map(b => `
        <article class="card">
          <div class="card-top">
            <div>
              <div class="card-title">${b.fr}</div>
              <div class="card-sub">${b.lieu}</div>
            </div>
            <span class="tag">${b.comportement}</span>
          </div>
          ${imgBlock(b.image, b.fr)}
          <div class="details">
            <div><strong>Apprivoiser :</strong> ${b.debloquer}</div>
            <div><strong>Approche :</strong> ${b.approche}</div>
            <div><strong>Nourriture préférée :</strong> ${b.preferee}</div>
            <div><strong>Nourriture appréciée :</strong> ${b.appreciee}</div>
            <div><strong>Bonus :</strong> ${b.bonus}</div>
          </div>
        </article>
      `);
      return buildSection("Bestioles", items);
    }

    function renderCompagnons(list) {
      const items = list.filter(matchesSearch).map(c => `
        <article class="card">
          <div class="card-top">
            <div>
              <div class="card-title">${c.fr}</div>
              <div class="card-sub">${c.role}</div>
            </div>
            <span class="tag">Compagnon</span>
          </div>
          ${imgBlock(c.image, c.fr)}
          <div class="details">
            <div><strong>Bonus :</strong> ${c.bonus}</div>
            <div><strong>Notes :</strong> ${c.notes}</div>
          </div>
        </article>
      `);
      return buildSection("Compagnons d'aventure", items);
    }

    function renderRecettes(list) {
      const sousCats = ["Hors-d'oeuvre", "Plats principaux", "Desserts"];
      return sousCats.map(sc => {
        const items = list.filter(r => r.sous_categorie === sc && matchesSearch(r)).map(r => `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="card-title">${r.fr}</div>
                <div class="card-sub">${r.en}</div>
              </div>
              <span class="tag">${"★".repeat(r.stars)}</span>
            </div>
            ${imgBlock(r.image, r.fr)}
            <div class="details">
              <div><strong>Ingrédients :</strong> ${r.ingredients}</div>
            </div>
            <div class="footer-meta">
              <span class="energy">⚡ Énergie : ${r.energy}</span>
              <span class="price">🪙 Vente : ${r.price}</span>
            </div>
          </article>
        `);
        return buildSection(`Recettes — ${sc}`, items);
      }).join("");
    }

    function renderCrafting(list) {
      const items = list.filter(matchesSearch).map(cr => `
        <article class="card">
          <div class="card-top">
            <div>
              <div class="card-title">${cr.fr}</div>
              <div class="card-sub">${cr.en}</div>
            </div>
            <span class="tag">${cr.categorie}</span>
          </div>
          ${imgBlock(cr.image, cr.fr)}
          <div class="details">
            <div><strong>Matériaux :</strong> ${cr.ingredients}</div>
          </div>
        </article>
      `);
      return buildSection("Crafting", items, "Aucune fabrication ajoutée pour l'instant.");
    }

    function renderPoissons(list) {
      const items = list.filter(matchesSearch).map(p => `
        <article class="card">
          <div class="card-top">
            <div>
              <div class="card-title">${p.fr}</div>
              <div class="card-sub">${p.type}</div>
            </div>
          </div>
          ${imgBlock(p.image, p.fr)}
        </article>
      `);
      return buildSection("Poissons", items);
    }

    function renderRecoltes(list) {
      const cats = [
        "sous l'eau",
        "matériaux d'artisanat",
        "fleurs",
        "récupération",
        "ingrédients"
      ];
      return cats.map(cat => {
        const items = list.filter(rec => rec.categorie === cat && matchesSearch(rec)).map(rec => `
          <article class="card">
            <div class="card-top">
              <div>
                <div class="card-title">${rec.fr}</div>
                <div class="card-sub">${rec.categorie}</div>
              </div>
            </div>
            ${imgBlock(rec.image, rec.fr)}
          </article>
        `);
        return buildSection(`Récoltes — ${cat}`, items);
      }).join("");
    }

    function renderPage() {
      if (!db) return;
      const target = document.getElementById("pageContent");

      if (currentPage === "accueil") {
        target.innerHTML = `
          <div class="welcome-panel">
            <strong>Bienvenue sur La Mer des Souvenirs.</strong> Cliquez sur l'une des catégories ci-dessus (Bestioles, Compagnons, Recettes, Crafting, Poissons, Récoltes) ou utilisez la barre de recherche pour afficher les fiches correspondantes.
          </div>
        `;
      } else if (currentPage === "bestioles") {
        target.innerHTML = renderBestioles(db.bestioles);
      } else if (currentPage === "compagnons") {
        target.innerHTML = renderCompagnons(db.compagnons);
      } else if (currentPage === "recettes") {
        target.innerHTML = renderRecettes(db.recettes);
      } else if (currentPage === "crafting") {
        target.innerHTML = renderCrafting(db.crafting);
      } else if (currentPage === "poissons") {
        target.innerHTML = renderPoissons(db.poissons);
      } else if (currentPage === "recoltes") {
        target.innerHTML = renderRecoltes(db.recoltes);
      }
    }

    fetch("data.json")
      .then(r => r.json())
      .then(data => {
        db = data;
        renderPage();
      });

    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentPage = btn.dataset.page;
        renderPage();
      });
    });

    document.getElementById("searchInput").addEventListener("input", e => {
      searchText = e.target.value;
      if (currentPage === "accueil" && searchText.trim()) {
        currentPage = "recettes";
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.page === "recettes"));
      }
      renderPage();
    });
  </script>
</body>
</html>
